[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-lyric-engine"
version = "1.0.0"
description = "Turkish lyric intelligence, corpus, morphology, meter and revision engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
morphology = ["zeyrek==0.1.3", "nltk==3.10.3"]

[project.scripts]
tle = "turkish_lyric_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
