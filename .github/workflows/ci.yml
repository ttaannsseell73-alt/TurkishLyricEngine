name: lyric-foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core regression checks (no model/network dependency)
        run: python scripts/run_checks.py --suite core --report reports/local/core.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: reports/local/core.json
  morphology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned real morphology backend
        run: python -m pip install -r requirements-morphology.lock.txt
      - name: Real backend integration regression checks
        run: python scripts/run_checks.py --suite morphology --report reports/local/morphology.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morphology-real
          path: reports/local/morphology.json
